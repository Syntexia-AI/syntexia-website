<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Syntexia share image</title>
    <!-- Image de partage, 1200 x 630, sur la surface noire. Rendue en
         public/og-image.png par node scripts/brand-assets.mjs, avec les
         tokens et les polices du site : elle suit la direction toute seule.
         Le titre est celui de l'accueil, composé comme lui. -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
      }

      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 76px 80px 84px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .mark {
        display: grid;
        grid-template-columns: repeat(5, 9px);
        gap: 5px;
      }

      .mark i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--quiet);
      }

      .mark i.on {
        background: var(--fg);
      }

      .mark i.core {
        background: var(--dot);
      }

      .name {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--fg);
      }

      .name span {
        color: var(--meta);
        font-weight: 500;
      }

      h1 {
        margin: 0;
        font-size: 116px;
        font-weight: var(--w-title);
        line-height: 0.9;
        letter-spacing: -0.045em;
        color: var(--fg);
      }

      h1 span {
        display: block;
      }

      .dot {
        display: inline-block;
        width: 0.16em;
        height: 0.16em;
        margin-left: 0.04em;
        border-radius: 50%;
        background: var(--dot);
      }
    </style>
  </head>
  <body class="on-black">
    <div class="card">
      <div class="brand">
        <span class="mark" aria-hidden="true"
          ><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i
          ><i class="on"></i><i></i><i></i><i></i><i></i
          ><i class="on"></i><i class="on"></i><i class="core"></i><i class="on"></i><i class="on"></i
          ><i></i><i></i><i></i><i></i><i class="on"></i
          ><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i
        ></span>
        <span class="name">Syntexia<span>.AI</span></span>
      </div>
      <h1><span>Intelligence that</span><span>lives in your</span><span>ecosystem<i class="dot"></i></span></h1>
    </div>
  </body>
</html>
