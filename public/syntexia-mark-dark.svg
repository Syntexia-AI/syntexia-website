<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Syntexia mark">
  <title>Syntexia mark</title>
  <!-- Le mark sur la surface noire : points blancs, points discrets en suie,
       cœur en cuivre clair (tokens --white, --soot, --copper-lit). -->
  <rect width="512" height="512" rx="80" ry="80" fill="#000000"/>
  <g fill="#2B2A28">
    <circle cx="432" cy="80" r="25"/>
    <circle cx="168" cy="168" r="25"/>
    <circle cx="256" cy="168" r="25"/>
    <circle cx="344" cy="168" r="25"/>
    <circle cx="432" cy="168" r="25"/>
    <circle cx="80" cy="344" r="25"/>
    <circle cx="168" cy="344" r="25"/>
    <circle cx="256" cy="344" r="25"/>
    <circle cx="344" cy="344" r="25"/>
    <circle cx="432" cy="432" r="25"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="80" cy="80" r="25"/>
    <circle cx="168" cy="80" r="25"/>
    <circle cx="256" cy="80" r="25"/>
    <circle cx="344" cy="80" r="25"/>
    <circle cx="80" cy="168" r="25"/>
    <circle cx="80" cy="256" r="25"/>
    <circle cx="168" cy="256" r="25"/>
    <circle cx="344" cy="256" r="25"/>
    <circle cx="432" cy="256" r="25"/>
    <circle cx="432" cy="344" r="25"/>
    <circle cx="80" cy="432" r="25"/>
    <circle cx="168" cy="432" r="25"/>
    <circle cx="256" cy="432" r="25"/>
    <circle cx="344" cy="432" r="25"/>
  </g>
  <circle cx="256" cy="256" r="28" fill="#E39B5E"/>
</svg>
