# Temporaire : régénère package-lock.json depuis zéro avec les nouvelles
# dépendances, le commite sur cette branche, puis construit et contrôle le
# site. Branche supprimée une fois le lockfile récupéré.

name: Regenerate the lockfile

on:
  push:
    branches: [deps-upgrade]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Resolve the dependencies from scratch
        run: |
          rm -rf package-lock.json node_modules
          npm install --no-fund 2>&1 | tee install.log

      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: regenerate package-lock.json" || echo "lockfile unchanged"
          git push

      - name: Versions
        if: always()
        run: (node -v; npm -v; npm ls --depth=0) 2>&1 | tee versions.log

      - name: Audit
        if: always()
        run: npm audit 2>&1 | tee audit.log

      - name: Build
        if: always()
        run: npm run build 2>&1 | tee build.log

      - name: Checks
        if: always()
        run: npm run check 2>&1 | tee check.log

      - name: Report
        if: always()
        run: |
          for f in install.log versions.log audit.log build.log check.log; do
            [ -s "$f" ] || continue
            body=$(tail -n 80 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=${f}::${body}"
          done
